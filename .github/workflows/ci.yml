name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Multi-major matrix (2026-08-12): Marketplace validation on 4.5 + 5.1 + 5.2.
#
# BL-20: pin release tags, not MOODLE_*_STABLE. STABLE gains commits every week, and
# moodle-plugin-ci re-clones it on every run, so CI could turn red without a single commit
# from us. Tags used here (verify when bumping):
#   - v4.5.12  — 4.5 LTS pin already in use
#   - v5.1.6   — latest 5.1.x tag at decision time (prefer over MOODLE_501_STABLE)
#   - v5.2.2   — latest 5.2.x tag at decision time (prefer over MOODLE_502_STABLE)
#
# PHP: 8.3 on every cell (supported on 4.5, 5.1, and 5.2; 5.2 minimum is 8.3).
# DB: MariaDB 10.11 on all majors; one Postgres cell on 5.2 with PG16 (5.2 minimum).
#
# A tag is valid where it is used. moodle-plugin-ci passes this value through
# Validate::gitBranch(), and MoodleInstaller runs `git clone --depth 1 --branch <value>`,
# which git resolves to a tag. A raw commit hash would NOT work.
#
# $plugin->requires stays 4.5.0 (2024100700). $plugin->supported = [405, 501, 502] (Moodle 4.5 / 5.1 / 5.2).
# CI matrix covers 4.5 / 5.1 / 5.2 (static-checks + phpunit jobs below).

jobs:

  # ---------------------------------------------------------------------------
  # Fast static analysis: validate/savepoints, phplint, phpmd (soft), phpcs, phpdoc,
  # grunt (ESLint), PHPStan; plus AMD build diff gate and script guards. PHPUnit/Behat
  # gate on this job.
  # ---------------------------------------------------------------------------
  static-checks:
    name: Static (${{ matrix.moodle-branch }} / ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: v4.5.12
            php: '8.3'
            database: mariadb
          - moodle-branch: v5.1.6
            php: '8.3'
            database: mariadb
          - moodle-branch: v5.2.2
            php: '8.3'
            database: mariadb
          - moodle-branch: v5.2.2
            php: '8.3'
            database: pgsql

    services:
      # Both services start on every cell; moodle-plugin-ci uses DB= from the matrix.
      # PG16: required minimum for Moodle 5.2; fine for the single pgsql cell.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: "postgres"
          POSTGRES_HOST_AUTH_METHOD: "trust"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_bin"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=8

    steps:
      - name: Check out plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, gd, zip, curl, xml, openssl, ctype, iconv, intl, soap
          ini-values: max_input_vars=5000
          coverage: none

      # Two caches, both purely additive: on a miss the step behaves exactly as it did
      # before, so neither can turn a run red. Keyed on moodle-branch because that decides
      # composer constraints and node version (moodle-plugin-ci reads Moodle's .nvmrc).
      - name: Cache composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.moodle-branch }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Cache node (nvm)
        uses: actions/cache@v6
        with:
          path: ~/.nvm/versions/node
          key: nvm-${{ runner.os }}-${{ matrix.moodle-branch }}

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci 4.5.11
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Moodle plugin validate
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate ./plugin

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints ./plugin

      # BL-36: AMD source and build must stay in step. Node version comes from Moodle's
      # .nvmrc via moodle-plugin-ci — not a second pin in this file.
      #
      # Moodle 5.1+ installs plugins under public/ (MDL-83424); 4.5 keeps local/. Resolve
      # the path once so grunt/phpstan work on every matrix cell.
      - name: AMD build is in step with its source
        working-directory: ${{ github.workspace }}/moodle
        run: |
          # Do not export as PLUGIN_DIR — moodle-plugin-ci reads that name and breaks
          # phplint/phpcs with Failed to run realpath(...).
          ARTQTM_PLUGIN_REL=""
          for cand in local/artqtml public/local/artqtml; do
            if [ -d "$cand" ]; then
              ARTQTM_PLUGIN_REL="$cand"
              break
            fi
          done
          if [ -z "$ARTQTM_PLUGIN_REL" ]; then
            echo "::error::Plugin directory not found (tried local/artqtml and public/local/artqtml)."
            ls -la local 2>/dev/null || true
            ls -la public/local 2>/dev/null || true
            exit 1
          fi
          echo "ARTQTM_PLUGIN_REL=$ARTQTM_PLUGIN_REL" >> "$GITHUB_ENV"
          echo "Using plugin path: $ARTQTM_PLUGIN_REL"

          node_version="$(node --version)"
          echo "node: $node_version (Moodle .nvmrc: $(cat .nvmrc 2>/dev/null || echo 'missing'))"
          case "$node_version" in
            v22.*) ;;
            *) echo "::error::Moodle's grunt requires node >=22.11 <23, found $node_version." \
                    "The .nvmrc says $(cat .nvmrc 2>/dev/null || echo 'missing') - the toolchain install did not honour it."
               exit 1 ;;
          esac
          npx grunt amd --root="$ARTQTM_PLUGIN_REL"
          # Copy the freshly built files back over the checkout before comparing. Where
          # moodle-plugin-ci symlinked the plugin this is a no-op; where it copied, it is what makes
          # the comparison mean anything at all.
          cp -R "$ARTQTM_PLUGIN_REL/amd/build/." "${{ github.workspace }}/plugin/amd/build/"
      - name: Fail if the committed AMD build is stale
        working-directory: ${{ github.workspace }}/plugin
        run: |
          if ! git diff --exit-code -- amd/build; then
            echo "::error::amd/build does not match amd/src." \
                 "Run grunt amd against the plugin under Moodle (local/ or public/local/ on 5.1+)" \
                 "and commit the result."
            exit 1
          fi
          echo "amd/build matches amd/src."

      # BL-43: every tools/**.sh stays executable.
      - name: Script guards
        run: bash "${{ github.workspace }}/plugin/tools/script-guard.sh"

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint ./plugin

      - name: PHP Mess Detector (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci phpmd ./plugin

      - name: PHP CodeSniffer (Moodle standard)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --standard "${{ github.workspace }}/plugin/phpcs.xml" ./plugin

      - name: PHPDoc (zero warnings)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0 ./plugin

      # No mustache step: this plugin has no templates/ directory.

      - name: ESLint (grunt, zero lint warnings)
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0 ./plugin

      # BL-21: PHPStan pinned (must match tools/devtools/composer.json → phpstan/phpstan 2.2.5).
      - name: Install plugin PHPStan toolchain
        working-directory: ${{ github.workspace }}/plugin/tools/devtools
        # No --no-audit: moodle-plugin-ci puts an older Composer on PATH that rejects that flag.
        run: composer install --no-interaction --no-progress

      - name: PHPStan (level 5, Moodle-aware + disallowed-calls)
        working-directory: ${{ github.workspace }}/moodle
        env:
          PHPSTAN_VERSION: 2.2.5
        run: |
          ARTQTM_PLUGIN_REL="${ARTQTM_PLUGIN_REL:-}"
          if [ -z "$ARTQTM_PLUGIN_REL" ]; then
            for cand in local/artqtml public/local/artqtml; do
              if [ -d "$cand" ]; then
                ARTQTM_PLUGIN_REL="$cand"
                break
              fi
            done
          fi
          if [ -z "$ARTQTM_PLUGIN_REL" ] || [ ! -d "$ARTQTM_PLUGIN_REL" ]; then
            echo "::error::Plugin directory not found for PHPStan."
            exit 1
          fi
          DEVTOOLS_BIN="${{ github.workspace }}/plugin/tools/devtools/vendor/bin/phpstan"
          if [ ! -d "$ARTQTM_PLUGIN_REL/tools/devtools/vendor" ]; then
            mkdir -p "$ARTQTM_PLUGIN_REL/tools/devtools"
            cp -a "${{ github.workspace }}/plugin/tools/devtools/vendor" \
              "$ARTQTM_PLUGIN_REL/tools/devtools/"
          fi
          php "$DEVTOOLS_BIN" --version
          php -d memory_limit=2G "$DEVTOOLS_BIN" analyse \
            --configuration="$ARTQTM_PLUGIN_REL/phpstan.neon" --no-progress

  # ---------------------------------------------------------------------------
  # PHPUnit: full Moodle install, then the plugin's test suite.
  # ---------------------------------------------------------------------------
  phpunit:
    name: PHPUnit (${{ matrix.moodle-branch }} / ${{ matrix.database }})
    needs: static-checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: v4.5.12
            php: '8.3'
            database: mariadb
          - moodle-branch: v5.1.6
            php: '8.3'
            database: mariadb
          - moodle-branch: v5.2.2
            php: '8.3'
            database: mariadb
          - moodle-branch: v5.2.2
            php: '8.3'
            database: pgsql

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: "postgres"
          POSTGRES_HOST_AUTH_METHOD: "trust"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_bin"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=8

    steps:
      - name: Check out plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, gd, zip, curl, xml, openssl, ctype, iconv, intl, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Cache composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.moodle-branch }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Cache node (nvm)
        uses: actions/cache@v6
        with:
          path: ~/.nvm/versions/node
          key: nvm-${{ runner.os }}-${{ matrix.moodle-branch }}

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci 4.5.11
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHPUnit (local_artqtml_testsuite)
        run: moodle-plugin-ci phpunit --fail-on-warning ./plugin

  # ---------------------------------------------------------------------------
  # Behat: browser acceptance tests. One cell per supported major (4.5 LTS + 5.2).
  # Selenium is required for @javascript (approve confirm, status.js, question editor).
  # ---------------------------------------------------------------------------
  behat:
    name: Behat (${{ matrix.moodle-branch }})
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: v4.5.12
            php: '8.3'
            database: mariadb
          - moodle-branch: v5.2.2
            php: '8.3'
            database: mariadb

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_bin"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=8
      selenium:
        image: selenium/standalone-chromium:4.36.0-20251001
        volumes:
          - /dev/shm:/dev/shm

    steps:
      - name: Check out plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, mysqli, gd, zip, curl, xml, openssl, ctype, iconv, intl, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Cache composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.moodle-branch }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci 4.5.11
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Behat (@local_artqtml)
        id: behat
        run: moodle-plugin-ci behat --profile chrome --tags @local_artqtml --scss-deprecations ./plugin

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat Faildump (${{ matrix.moodle-branch }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore
