name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# moodle-plugin-ci matrix values shared by the static-checks and phpunit jobs.
#
# BL-20: a fixed tag, not MOODLE_405_STABLE. That branch gains commits every week, and
# moodle-plugin-ci re-clones it on every run, so CI could turn red without a single commit from us -
# which it did on 2026-07-30, when the local PHPUnit environment refused to run against a tree that
# had moved underneath it. Following minor releases buys nothing here: a new major Moodle is its own
# piece of work, planned as such, not something to absorb one weekly commit at a time.
#
# A tag is valid where it is used. moodle-plugin-ci passes this value through
# Validate::gitBranch(), whose pattern /^[a-zA-Z0-9\/\+\._-]+$/ accepts it, and MoodleInstaller runs
# `git clone --depth 1 --branch <value>`, which git resolves to a tag. A raw commit hash would NOT
# work - `git clone --branch` does not take one.
#
# Moving to a newer Moodle means editing this line deliberately, and pointing the local checkout
# (~/projektek/moodle) at the same tag so the two environments stay identical.
env:
  MOODLE_BRANCH: v4.5.12
  PHP_VERSION: "8.3"

jobs:

  # ---------------------------------------------------------------------------
  # Fast static analysis: php -l, PHPStan (level 5, Moodle-aware), PHPCS (Moodle
  # standard). Runs first; the heavier phpunit job gates on it.
  # ---------------------------------------------------------------------------
  static-checks:
    name: Static checks (lint / phpstan / phpcs)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_bin"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=8

    steps:
      - name: Check out plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pgsql, mysqli, gd, zip, curl, xml, openssl, ctype, iconv, intl, soap
          ini-values: max_input_vars=5000
          coverage: none

      # Two caches, both purely additive: on a miss the step behaves exactly as it did
      # before, so neither can turn a run red. They exist because "Install Moodle + plugin"
      # below downloads a full node toolchain and re-resolves every composer package on
      # every run - and both jobs run it, so each download happens twice per CI run.
      #
      # Keyed on MOODLE_BRANCH because that is what decides both: the composer constraint
      # set and the node version (moodle-plugin-ci reads Moodle's own .nvmrc). The branch is
      # a fixed tag since BL-20, so the key cannot silently go stale - which is exactly what
      # made this cacheable in the first place.
      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ env.MOODLE_BRANCH }}
          restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Cache node (nvm)
        uses: actions/cache@v4
        with:
          path: ~/.nvm/versions/node
          key: nvm-${{ runner.os }}-${{ env.MOODLE_BRANCH }}

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ env.MOODLE_BRANCH }}

      # BL-36: the AMD source and the built file are two files in the repository, and until this
      # step the only thing keeping them in step was somebody remembering to run `grunt amd`. A
      # commit that edits amd/src and forgets the build was green, and the browser went on running
      # the old behaviour. That happened twice on 2026-08-01 - once the shipped
      # generatesettings.min.js had to be replaced by hand, and once a fixed reload loop kept
      # looping until the rebuilt file was actually served.
      #
      # The node version is NOT pinned here. Moodle's own .nvmrc decides it (lts/jod) and
      # moodle-plugin-ci installs from that; a second version written into this file would be a
      # second source for one fact, which is the shape this project keeps removing. What this does
      # instead is check the one that exists, and say so plainly if it does not fit - because the
      # failure otherwise arrives as grunt refusing to start, which reads like a broken build.
      - name: AMD build is in step with its source
        working-directory: ${{ github.workspace }}/moodle
        run: |
          node_version="$(node --version)"
          echo "node: $node_version (Moodle .nvmrc: $(cat .nvmrc))"
          case "$node_version" in
            v22.*) ;;
            *) echo "::error::Moodle's grunt requires node >=22.11 <23, found $node_version." \
                    "The .nvmrc says $(cat .nvmrc) - the toolchain install did not honour it."
               exit 1 ;;
          esac
          npx grunt amd --root=local/artqtml
          # Copy the freshly built files back over the checkout before comparing. Where
          # moodle-plugin-ci symlinked the plugin this is a no-op; where it copied, it is what makes
          # the comparison mean anything at all. Doing it unconditionally keeps the check honest
          # under both, instead of silently passing under one of them.
          cp -R local/artqtml/amd/build/. "${{ github.workspace }}/plugin/amd/build/"
      - name: Fail if the committed AMD build is stale
        working-directory: ${{ github.workspace }}/plugin
        run: |
          if ! git diff --exit-code -- amd/build; then
            echo "::error::amd/build does not match amd/src." \
                 "Run: cd \$MOODLE_ROOT/local/artqtml && ../../node_modules/.bin/grunt amd" \
                 "and commit the result."
            exit 1
          fi
          echo "amd/build matches amd/src."

      # The one guard that survived the browser suite's removal (BL-43): every tools/**.sh stays
      # executable. It is a shell script, so it is tied to every push. Placed before phplint
      # because it is the cheapest step in the job.
      - name: Script guards
        run: bash "${{ github.workspace }}/plugin/tools/script-guard.sh"

      - name: PHP Lint
        run: moodle-plugin-ci phplint

      - name: PHP CodeSniffer (Moodle standard)
        # Use the plugin's phpcs.xml (Moodle standard + the dev-only tools/ exclusion) rather than
        # the bare "moodle" standard moodle-plugin-ci defaults to.
        run: moodle-plugin-ci phpcs --standard "${{ github.workspace }}/plugin/phpcs.xml"

      # moodle-plugin-ci has no phpstan command, so run PHPStan directly against the Moodle tree
      # it installed, using the plugin's own level-5 config + Moodle-aware bootstrap.
      #
      # BL-21: pinned, not "latest". A floating version means a new PHPStan release can turn an
      # unchanged tree red - the failure arrives with no commit of ours behind it, and a red build
      # is the wrong way to learn that a new version exists. Pinned, a release changes nothing until
      # we choose it, and dependabot (.github/dependabot.yml) opens a pull request to tell us.
      #
      # Composer-based PHPStan (not the bare phar): phpstan.neon includes
      # spaze/phpstan-disallowed-calls, which only loads from tools/devtools/vendor. The pin below
      # must match tools/devtools/composer.json (phpstan/phpstan 2.2.5). tools/check.sh compares
      # local vs CI; if they drift, "green locally, red on CI" comes back (BL-15).
      #
      # Composer package cache is already restored above (~/.cache/composer). Install into the
      # checkout's tools/devtools; if moodle-plugin-ci copied (not symlinked) the plugin into
      # the Moodle tree, sync vendor so neon includes resolve under local/artqtml/.
      - name: Install plugin PHPStan toolchain
        working-directory: ${{ github.workspace }}/plugin/tools/devtools
        # No --no-audit: moodle-plugin-ci puts an older Composer on PATH that rejects that flag.
        # Advisory blocking for pinned phpcs is already off via composer.json audit.block-insecure.
        run: composer install --no-interaction --no-progress

      - name: PHPStan (level 5, Moodle-aware + disallowed-calls)
        working-directory: ${{ github.workspace }}/moodle
        env:
          # Must match tools/devtools/composer.json → phpstan/phpstan.
          PHPSTAN_VERSION: 2.2.5
        run: |
          DEVTOOLS_BIN="${{ github.workspace }}/plugin/tools/devtools/vendor/bin/phpstan"
          if [ ! -d local/artqtml/tools/devtools/vendor ]; then
            mkdir -p local/artqtml/tools/devtools
            cp -a "${{ github.workspace }}/plugin/tools/devtools/vendor" \
              local/artqtml/tools/devtools/
          fi
          php "$DEVTOOLS_BIN" --version
          php -d memory_limit=2G "$DEVTOOLS_BIN" analyse \
            --configuration=local/artqtml/phpstan.neon --no-progress

  # ---------------------------------------------------------------------------
  # PHPUnit: full Moodle install, then the plugin's test suite (46 tests).
  # ---------------------------------------------------------------------------
  phpunit:
    name: PHPUnit
    needs: static-checks
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_bin"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=8

    steps:
      - name: Check out plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pgsql, mysqli, gd, zip, curl, xml, openssl, ctype, iconv, intl, soap
          ini-values: max_input_vars=5000
          coverage: none

      # Two caches, both purely additive: on a miss the step behaves exactly as it did
      # before, so neither can turn a run red. They exist because "Install Moodle + plugin"
      # below downloads a full node toolchain and re-resolves every composer package on
      # every run - and both jobs run it, so each download happens twice per CI run.
      #
      # Keyed on MOODLE_BRANCH because that is what decides both: the composer constraint
      # set and the node version (moodle-plugin-ci reads Moodle's own .nvmrc). The branch is
      # a fixed tag since BL-20, so the key cannot silently go stale - which is exactly what
      # made this cacheable in the first place.
      - name: Cache composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ env.MOODLE_BRANCH }}
          restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Cache node (nvm)
        uses: actions/cache@v4
        with:
          path: ~/.nvm/versions/node
          key: nvm-${{ runner.os }}-${{ env.MOODLE_BRANCH }}

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle + plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ env.MOODLE_BRANCH }}

      - name: PHPUnit (local_artqtml_testsuite)
        run: moodle-plugin-ci phpunit